version: "3.9"

services:
  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: "dev-secret-key"
      DB_HOST: db
      DB_NAME: hancom
      DB_USER: hancom
      DB_PASSWORD: hancom
      DB_PORT: "5432"
      JWT_ACCESS_MINUTES: "30"
      JWT_REFRESH_DAYS: "7"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hancom
      POSTGRES_USER: hancom
      POSTGRES_PASSWORD: hancom
    ports:
      - "5432:5432"
    volumes:
      - hancom_db:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  hancom_db:
