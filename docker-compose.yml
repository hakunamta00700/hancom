version: "3.9"

services:
  backend:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: "dev-secret-key"
      DB_HOST: db
      DB_NAME: hancom
      DB_USER: hancom
      DB_PASSWORD: hancom
      DB_PORT: "5432"
      JWT_ACCESS_MINUTES: "30"
      JWT_REFRESH_DAYS: "7"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      # 브라우저(클라이언트)에서 호출 시: 호스트의 8000으로 접근
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
      # Next.js 서버 컴포넌트/서버 사이드에서 호출 시: compose 네트워크의 서비스명으로 접근
      API_BASE_URL: "http://backend:8000"
    depends_on:
      - backend

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hancom
      POSTGRES_USER: hancom
      POSTGRES_PASSWORD: hancom
    ports:
      - "5432:5432"
    volumes:
      - hancom_db:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  hancom_db:
  frontend_node_modules:
  frontend_next_cache:
